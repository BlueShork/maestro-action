name: selftest

on:
  workflow_dispatch:

jobs:
  validation:
    name: input validation (no quota)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bad platform must fail fast
        id: bad
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: nope
          app: README.md
          flow: examples/smoke.yaml
      - name: assert the bad-platform step failed
        run: |
          if [[ "${{ steps.bad.outcome }}" != "failure" ]]; then
            echo "::error::expected the bad-platform step to fail, got '${{ steps.bad.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects an invalid platform"
      - name: web without url must fail fast
        id: web_no_url
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          flow: examples/smoke.yaml
      - name: assert the web-without-url step failed
        run: |
          if [[ "${{ steps.web_no_url.outcome }}" != "failure" ]]; then
            echo "::error::expected the web-without-url step to fail, got '${{ steps.web_no_url.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects web without a url"
      - name: android without app must fail fast
        id: android_no_app
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: android
          flow: examples/smoke.yaml
      - name: assert the android-without-app step failed
        run: |
          if [[ "${{ steps.android_no_app.outcome }}" != "failure" ]]; then
            echo "::error::expected the android-without-app step to fail, got '${{ steps.android_no_app.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects android without an app"

  e2e:
    name: end-to-end submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create a placeholder app
        run: printf 'placeholder-not-a-real-apk' > app.apk
      - name: run the action
        id: maestro
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: android
          app: app.apk
          flow: examples/smoke.yaml
      - name: assert the action ran end-to-end
        run: |
          echo "job_id=${{ steps.maestro.outputs.job_id }}"
          echo "status=${{ steps.maestro.outputs.status }}"
          echo "report_url=${{ steps.maestro.outputs.report_url }}"
          if [[ -z "${{ steps.maestro.outputs.job_id }}" ]]; then
            echo "::error::action produced no job_id (it did not reach finalize)"
            exit 1
          fi
          case "${{ steps.maestro.outputs.status }}" in
            passed|failed|error)
              echo "action produced a terminal status: ${{ steps.maestro.outputs.status }}"
              ;;
            *)
              echo "::error::unexpected status '${{ steps.maestro.outputs.status }}'"
              exit 1
              ;;
          esac

  e2e-web:
    name: end-to-end web run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Contrairement au job android ci-dessus, qui envoie un APK bidon et ne
      # peut donc que constater un statut terminal, celui-ci lance un vrai
      # parcours sur un vrai site : il doit finir "passed". C'est ce qui prouve
      # que la chaîne web fonctionne réellement de bout en bout.
      - name: run the action against a live site
        id: maestro
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          url: https://www.nrj.fr/
          flow: examples/web-nrj.yaml
      - name: assert the web run passed
        if: always()
        run: |
          echo "job_id=${{ steps.maestro.outputs.job_id }}"
          echo "status=${{ steps.maestro.outputs.status }}"
          echo "report_url=${{ steps.maestro.outputs.report_url }}"
          if [[ "${{ steps.maestro.outputs.status }}" != "passed" ]]; then
            echo "::error::expected the web run to pass, got '${{ steps.maestro.outputs.status }}'"
            exit 1
          fi
          echo "web platform ran a live flow end-to-end and passed"
