name: selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC, soit 05:00 à Paris en été. Le nightly est ce qui donne au
    # test sa valeur : sans lui une régression n'apparaîtrait qu'au prochain
    # push, donc potentiellement jamais sur un dépôt calme.
    - cron: "0 3 * * *"

jobs:
  validation:
    name: input validation (no quota)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bad platform must fail fast
        id: bad
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: nope
          app: README.md
          flow: examples/smoke.yaml
      - name: assert the bad-platform step failed
        run: |
          if [[ "${{ steps.bad.outcome }}" != "failure" ]]; then
            echo "::error::expected the bad-platform step to fail, got '${{ steps.bad.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects an invalid platform"
      - name: web without url must fail fast
        id: web_no_url
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          flow: examples/smoke.yaml
      - name: assert the web-without-url step failed
        run: |
          if [[ "${{ steps.web_no_url.outcome }}" != "failure" ]]; then
            echo "::error::expected the web-without-url step to fail, got '${{ steps.web_no_url.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects web without a url"
      - name: android without app must fail fast
        id: android_no_app
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: android
          flow: examples/smoke.yaml
      - name: assert the android-without-app step failed
        run: |
          if [[ "${{ steps.android_no_app.outcome }}" != "failure" ]]; then
            echo "::error::expected the android-without-app step to fail, got '${{ steps.android_no_app.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects android without an app"
      - name: missing bank_path must fail fast
        id: bank_not_found
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          url: https://example.com
          flow: examples/smoke.yaml
          bank_path: examples/no-such-bank-folder
      - name: assert the missing-bank_path step failed
        run: |
          if [[ "${{ steps.bank_not_found.outcome }}" != "failure" ]]; then
            echo "::error::expected the missing-bank_path step to fail, got '${{ steps.bank_not_found.outcome }}'"
            exit 1
          fi
          echo "validation correctly rejects a bank_path that does not exist"
      - name: out-of-bounds screen_size must be rejected
        id: screen_size_bad
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          url: https://example.com
          flow: examples/smoke.yaml
          screen_size: 99x99
      - name: assert the out-of-bounds screen_size step failed
        run: |
          if [[ "${{ steps.screen_size_bad.outcome }}" != "failure" ]]; then
            echo "::error::expected the out-of-bounds screen_size step to fail, got '${{ steps.screen_size_bad.outcome }}'"
            exit 1
          fi
          echo "the platform correctly rejects a screen_size outside the bounds"
      - name: screen_size on a mobile platform must be rejected
        id: screen_size_mobile
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: android
          app: README.md
          flow: examples/smoke.yaml
          screen_size: 1440x900
      - name: assert the mobile screen_size step failed
        run: |
          if [[ "${{ steps.screen_size_mobile.outcome }}" != "failure" ]]; then
            echo "::error::expected the mobile screen_size step to fail, got '${{ steps.screen_size_mobile.outcome }}'"
            exit 1
          fi
          echo "the platform correctly rejects screen_size on a mobile platform"

  e2e:
    name: end-to-end submission
    runs-on: ubuntu-latest
    # Manuel uniquement. Ce job envoie un APK bidon : il ne peut constater
    # qu'un statut terminal, jamais une réussite, donc son signal est faible
    # alors qu'il consomme un run comme les autres. Le faire tourner sur
    # chaque push et chaque nuit doublerait la dépense sans rien prouver de
    # plus que e2e-web.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: create a placeholder app
        run: printf 'placeholder-not-a-real-apk' > app.apk
      - name: run the action
        id: maestro
        continue-on-error: true
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: android
          app: app.apk
          flow: examples/smoke.yaml
          visual_strict: "true"
      - name: assert the action ran end-to-end
        run: |
          echo "job_id=${{ steps.maestro.outputs.job_id }}"
          echo "status=${{ steps.maestro.outputs.status }}"
          echo "report_url=${{ steps.maestro.outputs.report_url }}"
          if [[ -z "${{ steps.maestro.outputs.job_id }}" ]]; then
            echo "::error::action produced no job_id (it did not reach finalize)"
            exit 1
          fi
          case "${{ steps.maestro.outputs.status }}" in
            passed|failed|error)
              echo "action produced a terminal status: ${{ steps.maestro.outputs.status }}"
              ;;
            *)
              echo "::error::unexpected status '${{ steps.maestro.outputs.status }}'"
              exit 1
              ;;
          esac

  e2e-web:
    name: end-to-end web run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Contrairement au job android ci-dessus, qui envoie un APK bidon et ne
      # peut donc que constater un statut terminal, celui-ci lance un vrai
      # parcours sur un vrai site : il doit finir "passed". C'est ce qui prouve
      # que la chaîne web fonctionne réellement de bout en bout.
      # No continue-on-error here, deliberately: a real consumer of this
      # action never sets it either, so this step must fail the job exactly
      # the way theirs would the moment visual_strict trips on a regression.
      # run.sh writes GITHUB_OUTPUT before it checks visual_strict and exits,
      # so outputs stay readable below even when this step fails.
      - name: run the action against a live site
        id: maestro
        uses: ./
        with:
          api_key: ${{ secrets.MAESTRO_API_KEY }}
          platform: web
          url: https://www.nrj.fr/
          flow: examples/web-nrj.yaml
          bank_path: examples/web-nrj-bank
          app_name: maestro-action-selftest
          visual_strict: "true"
          screen_size: 1200x762
      - name: report result
        if: always()
        run: |
          echo "job_id=${{ steps.maestro.outputs.job_id }}"
          echo "status=${{ steps.maestro.outputs.status }}"
          echo "visual_changed=${{ steps.maestro.outputs.visual_changed }}"
          echo "visual_missing=${{ steps.maestro.outputs.visual_missing }}"
          echo "report_url=${{ steps.maestro.outputs.report_url }}"
