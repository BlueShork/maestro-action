name: "MaestroDeck Cloud"
description: "Run Maestro tests on MaestroDeck Cloud (iOS, Android or Web)"
author: "MaestroDeck"
branding:
  icon: "smartphone"
  color: "black"

inputs:
  api_key:
    description: "MaestroDeck API key (mk_live_...). Pass it via a GitHub secret."
    required: true
  platform:
    description: "ios / android / web"
    required: true
  app:
    description: "Path to the .apk (ANDROID) or .app.zip (IOS). Required unless platform is web."
    required: false
  url:
    description: "URL of the site to test, e.g. https://example.com. Required when platform is web."
    required: false
  flow:
    description: "Path or glob the Maestro .yaml flows files"
    required: true
  email:
    description: "(optional) Report email, defaults to the account email"
    required: false
  timeout:
    description: "(optional) Max seconds to wait for the result"
    required: false
    default: "1800"
  bank_path:
    description: "(optional) Folder of reference .png images, relative to the repo root. Empty disables visual regression."
    required: false
    default: ""
  app_name:
    description: "(optional) Name under which to file the bank on the platform. Only meaningful when bank_path is set."
    required: false
    default: ""
  visual_strict:
    description: "(optional) Fail the step when the visual report shows a difference."
    required: false
    default: "false"

outputs:
  job_id:
    description: "The created job id"
    value: ${{ steps.run.outputs.job_id }}
  status:
    description: "Final status: passed, failed or error"
    value: ${{ steps.run.outputs.status }}
  report_url:
    description: "Link to the report in the dashboard"
    value: ${{ steps.run.outputs.report_url }}
  visual_changed:
    description: "Number of bank images whose capture differs from the reference (empty when no bank was configured)"
    value: ${{ steps.run.outputs.visual_changed }}
  visual_missing:
    description: "Number of bank images with no matching capture (empty when no bank was configured)"
    value: ${{ steps.run.outputs.visual_missing }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: ${{ github.action_path }}/run.sh
      env:
        API_KEY: ${{ inputs.api_key }}
        PLATFORM: ${{ inputs.platform }}
        APP: ${{ inputs.app }}
        URL: ${{ inputs.url }}
        FLOW: ${{ inputs.flow }}
        EMAIL: ${{ inputs.email }}
        TIMEOUT: ${{ inputs.timeout }}
        BANK_PATH: ${{ inputs.bank_path }}
        APP_NAME: ${{ inputs.app_name }}
        VISUAL_STRICT: ${{ inputs.visual_strict }}
